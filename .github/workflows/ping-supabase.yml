name: Ping Supabase to Prevent Pausing

on:
  schedule:
    # Runs at 9:00 AM UTC every Monday and Thursday
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Supabase Client
        run: npm install @supabase/supabase-js

      - name: Ping Supabase Databases
        env:
          SUPABASE_CONFIGS: ${{ secrets.SUPABASE_CONFIGS }}
        run: |
          node <<'EOF'
          (async () => {
            const { createClient } = require('@supabase/supabase-js');

            if (!process.env.SUPABASE_CONFIGS) {
              console.error('Missing SUPABASE_CONFIGS secret');
              process.exit(1);
            }

            const configs = JSON.parse(process.env.SUPABASE_CONFIGS);
            if (!Array.isArray(configs) || configs.length === 0) {
              console.error('SUPABASE_CONFIGS must be a non-empty array');
              process.exit(1);
            }

            let failCount = 0;

            for (let i = 0; i < configs.length; i++) {
              const c = configs[i];
              const name = c.name || 'Database ' + (i + 1);
              try {
                if (!c.url || !c.key || !c.table) {
                  throw new Error('Missing url, key or table');
                }
                const supabase = createClient(c.url, c.key);
                const start = Date.now();
                const { data, error } = await supabase
                  .from(c.table)
                  .select('*')
                  .limit(1);
                if (error) throw new Error(error.message);
                console.log('OK', name, '-', Date.now() - start + 'ms, rows:', data.length);
              } catch (err) {
                console.error('FAILED', name, '-', err.message);
                failCount++;
              }
            }

            if (failCount > 0) process.exit(1);
          })();
          EOF
